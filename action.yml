name: "FlowLens Flow Audit"
description: "Audit the accessibility of a multi-step flow headlessly and emit a deterministic CI report + JUnit XML."
branding:
  icon: "eye"
  color: "orange"
inputs:
  urls:
    description: "Newline-separated URLs — each is one flow step, audited in order."
    required: false
    default: ""
  steps-file:
    description: "Path to a JSON file: [{\"url\": \"…\", \"label\": \"…\"}, …]. Takes precedence over urls."
    required: false
    default: ""
  wcag:
    description: "WCAG target level (2.1-AA | 2.1-AAA | 2.2-AA | 2.2-AAA)."
    required: false
    default: "2.2-AA"
  fail-on-blocking:
    description: "Fail the job when blocking findings exceed max-failures at baseline or are introduced by a step."
    required: false
    default: "true"
  max-failures:
    description: "Blocking findings allowed at the baseline step."
    required: false
    default: "0"
  out:
    description: "Output directory for flowlens-report.json and junit.xml."
    required: false
    default: "flowlens-ci"
runs:
  using: "composite"
  steps:
    - name: Install FlowLens dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci
        npx playwright install --with-deps chromium
    - name: Build audit snippet
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm run build
    # Inputs reach the script only through env vars and are passed as a bash
    # array — never interpolated into the script text — so a URL containing
    # quotes, $(...), backticks, spaces or glob characters stays one literal
    # argument.
    - name: Run flow audit
      shell: bash
      env:
        FL_ACTION_PATH: ${{ github.action_path }}
        FL_URLS: ${{ inputs.urls }}
        FL_STEPS_FILE: ${{ inputs.steps-file }}
        FL_WCAG: ${{ inputs.wcag }}
        FL_FAIL_ON_BLOCKING: ${{ inputs.fail-on-blocking }}
        FL_MAX_FAILURES: ${{ inputs.max-failures }}
        FL_OUT: ${{ inputs.out }}
      run: |
        set -euo pipefail
        args=()
        if [ -n "$FL_STEPS_FILE" ]; then
          args+=(--steps "$FL_STEPS_FILE")
        else
          while IFS= read -r url; do
            if [ -n "$url" ]; then args+=(--url "$url"); fi
          done <<< "$FL_URLS"
        fi
        if [ "$FL_FAIL_ON_BLOCKING" = "true" ]; then
          args+=(--fail-on-blocking)
        fi
        node "$FL_ACTION_PATH/scripts/ci-runner.mjs" "${args[@]}" \
          --wcag "$FL_WCAG" \
          --max-failures "$FL_MAX_FAILURES" \
          --out "$FL_OUT"
