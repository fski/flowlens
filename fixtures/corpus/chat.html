<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Support chat</title>
<style>body{font:16px sans-serif} .meta{color:#767676}</style></head>
<body><main><h1>Support</h1>
<section aria-label="Chat with support">
  <div role="log" aria-label="Messages" id="log" data-ok="role log feed">
    <div class="msg"><p>Hi! How can I help?</p><span class="meta" data-ok="4.54 grey">10:01</span></div>
    <div class="msg"><p>My order is late.</p></div>
  </div>
  <form>
    <label for="composer">Message</label>
    <textarea id="composer" data-ok="labelled composer"></textarea>
    <button type="submit" data-ok="svg title send"><svg width="16" height="16" aria-hidden="false"><title>Send</title><path d="M0 0h16v16z"/></svg></button>
    <button type="button" aria-label="Attach file" data-ok="aria-label icon"><svg width="16" height="16" aria-hidden="true"><path d="M0 0h16v16z"/></svg></button>
    <button type="button" data-defect="icon-only hidden glyph"><span aria-hidden="true">😊</span></button>
  </form>
</section>
<div id="toast" aria-live="polite" data-ok="toast region"></div>
<div role="dialog" aria-modal="true" data-defect="dialog no name"><p>Rate this chat</p><button>Close</button></div>
<a href="/help"><img src="data:," alt="Help center" data-ok="img alt"></a>
<span role="button" tabindex="0" onkeydown="void 0" onclick="void 0" data-ok="span button named+keys">Escalate</span>
<div role="checkbox" data-defect="checkbox no state no name"></div>
</main></body></html>
